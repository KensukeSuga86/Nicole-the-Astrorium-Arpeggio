<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nicole the Astrorium</title>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var forced=(q.get("mode")||"").toLowerCase();
  var ua=navigator.userAgent||"";
  var ipad=/iPad/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var target=forced==="ipad"?"./ipad.html":forced==="pc"?"./presenter.html":ipad?"./ipad.html":"./presenter.html";
  location.replace(target+location.search+location.hash);
})();
</script>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#061a44">
<link rel="apple-touch-icon" href="./icon-180.png">
</head>
<body>
<p><a href="./presenter.html?mode=pc">PC版を開く</a> / <a href="./ipad.html?mode=ipad">iPad版を開く</a></p>
<script src="./pwa-register.js"></script></body>
</html>
